services:
  - type: web
    name: exit-exam-backend
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    # Render's free plan has no pre-deploy hook, so migrations run on every start (no-op when up to date).
    startCommand: cd backend && python manage.py migrate --noinput && gunicorn exam_app.wsgi:application --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /api/
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.x.ai/v1
      - key: AI_MODEL
        sync: false
